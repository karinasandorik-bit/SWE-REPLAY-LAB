name: OWL PostgreSQL isolated recovery
on:
  workflow_dispatch:
jobs:
  pg-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: owl-postgres-test
    env:
      OWL_TEST_DATABASE_URL: ${{ secrets.OWL_TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure isolated test DSN configured
        run: |
          test -n "$OWL_TEST_DATABASE_URL" || { echo "Missing OWL_TEST_DATABASE_URL"; exit 1; }
          echo "::add-mask::$OWL_TEST_DATABASE_URL"
      - name: Install PostgreSQL client
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run controlled PostgreSQL recovery
        run: python tests/pg_sigkill_workers.py

name: OWL paired ablation
on:
  push:
    branches: [owl-ablation-001]
  workflow_dispatch:
jobs:
  paired:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -c "import json; from owl_ablation import evaluate; print(json.dumps({'baseline':evaluate(False),'full':evaluate(True)},sort_keys=True))"

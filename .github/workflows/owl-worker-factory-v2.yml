name: OWL Worker Factory v2
on:
  push:
    branches: [owl-ablation-001]
    paths:
      - 'owl_worker_factory_v2.py'
      - 'tests/test_worker_factory_v2.py'
      - '.github/workflows/owl-worker-factory-v2.yml'
  workflow_dispatch:
jobs:
  replay-audit-rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_worker_factory_v2.py' -v
